version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rfq_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-british_auction}
      POSTGRES_USER: ${POSTGRES_USER:-rfq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfq_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfq_user} -d ${POSTGRES_DB:-british_auction}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfq_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rfq_user}:${POSTGRES_PASSWORD:-rfq_secret}@db:5432/${POSTGRES_DB:-british_auction}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfq_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
